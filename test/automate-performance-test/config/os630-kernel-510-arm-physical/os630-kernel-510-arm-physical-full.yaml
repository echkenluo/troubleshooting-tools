version: '1.0'
environment: os630-kernel-510-arm-physical
ssh:
  ssh_hosts:
    host-server:
      host: 172.20.128.111
      user: smartx
      workdir: /home/smartx/lcc
    host-client:
      host: 172.20.128.112
      user: smartx
      workdir: /home/smartx/lcc
    vm-server:
      host: 172.20.225.98
      user: root
      workdir: /root/lcc
    vm-client:
      host: 172.20.225.57
      user: root
      workdir: /root/lcc
environments:
  host:
    description: Host-to-host testing on os630-kernel-510-arm-physical
    server:
      ssh_ref: host-server
      test_ip: 10.20.128.111
      interface: port-storage
    client:
      ssh_ref: host-client
      test_ip: 10.20.128.112
      interface: port-storage
    network_config:
      server_ip: 10.20.128.111
      client_ip: 10.20.128.112
      internal_interface: port-storage
      server_physical_interface: bond-m-r9l05wjsk
      server_physical_nic_members:
      - enp135s0f0np0
      - enp135s0f1np1
      client_physical_interface: bond-m-r9l05wjsk
      client_physical_nic_members:
      - enp1s0f0np0
      - enp1s0f1np1
  vm:
    description: VM-to-VM testing on os630-kernel-510-arm-physical
    server:
      ssh_ref: vm-server
      test_ip: 20.20.30.11
      interface: enp7s0
      vm_interface: vnet230
      physical_host_ref: host-server
    client:
      ssh_ref: vm-client
      test_ip: 20.20.30.12
      interface: enp7s0
      vm_interface: vnet85
      physical_host_ref: host-client
    network_config:
      server_ip: 20.20.30.11
      client_ip: 20.20.30.12
      server_physical_interface: bond-m-r9l05wjsk
      server_physical_nic_members:
      - enp135s0f0np0
      - enp135s0f1np1
      server_vm_interface: vnet230
      client_physical_interface: bond-m-r9l05wjsk
      client_physical_nic_members:
      - enp1s0f0np0
      - enp1s0f1np1
      client_vm_interface: vnet85
    kvm_config:
      server:
        qemu_pid: '1989279'
        vhost_pids:
        - '2044395'
        - '2044396'
        - '2044397'
        - '2044398'
        - '2044399'
        - '2044400'
        - '2044401'
        - '2044402'
      client:
        qemu_pid: '770411'
        vhost_pids:
        - '798220'
        - '798221'
        - '798222'
        - '798223'
        - '798224'
        - '798225'
        - '798226'
        - '798228'
paths:
  tools_dir: measurement-tools
  results_dir: ebpf-test-results
  measurement_tools_dir: ../../../measurement-tools
defaults:
  duration: 10
  timeout: 120
  use_sudo: true
  python_interpreter: python3
monitoring:
  enabled: true
  cpu: true
  memory: true
  memory_types:
  - virt
  - rss
  log_size: true
  cpu_stats:
  - avg
  - peak
tools:
  categories:
    performance/system-network:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: system_network_perfomance_metrics.py
        template: sudo python3 {path} --internal-interface {INTERNAL_INTERFACE} --phy-interface
          {PHY_INTERFACE} --src-ip {SRC_IP} --dst-ip {DST_IP} --direction {direction}
          --protocol {protocol} --latency-us {latency_threshold}
        latency_threshold: 10
        parameters:
          protocol:
          - tcp
          - udp
      - script: system_network_latency_details.py
        template: sudo python3 {path} --phy-interface {PHY_INTERFACE} --src-ip {SRC_IP}
          --dst-ip {DST_IP} --direction {direction} --protocol {protocol} --latency-us
          {latency_threshold}
        latency_threshold: 100
        parameters:
          protocol:
          - tcp
          - udp
      - script: system_network_latency_summary.py
        template: sudo python3 {path} --phy-interface {PHY_INTERFACE} --src-ip {SRC_IP}
          --dst-ip {DST_IP} --direction {direction} --protocol {protocol} --interval
          1
        parameters:
          protocol:
          - tcp
          - udp
      - script: system_network_icmp_rtt.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --direction
          {direction} --phy-interface {PHY_INTERFACE} --latency-ms {latency_threshold_ms}
        latency_threshold_ms: 1
        parameters:
          protocol:
          - icmp
      - script: kernel_icmp_rtt.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --direction
          {direction} --latency-ms {latency_threshold_ms}
        latency_threshold_ms: 1
        parameters:
          protocol:
          - icmp
    performance/system-network/ovs-internal-port:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: enqueue_to_iprec_latency_summary.py
        template: sudo python3 {path} --interface {INTERNAL_INTERFACE} --src-ip {SRC_IP}
          --dst-ip {DST_IP} --protocol {protocol} --interval 1
        parameters:
          protocol:
          - tcp
          - udp
      - script: enqueue_to_iprec_latency_threshold.py
        template: sudo python3 {path} --interface {INTERNAL_INTERFACE} --src-ip {SRC_IP}
          --dst-ip {DST_IP} --protocol {protocol} --threshold-us {latency_threshold}
        latency_threshold: 1000
        parameters:
          protocol:
          - tcp
          - udp
    performance/system-network/tcp-perf:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: tcp_rtt_inflight_summary.py
        template: sudo python3 {path} --laddr {SRC_IP} --raddr {DST_IP} --interval
          1
        parameters:
          protocol:
          - tcp
      - script: syscall_recv_latency_summary.py
        template: sudo python3 {path} --interval 1
        parameters:
          protocol:
          - tcp
    performance/vm-network:
      environment: vm
      directions:
        rx:
          SRC_IP: '{vm_REMOTE_IP}'
          DST_IP: '{vm_LOCAL_IP}'
        tx:
          SRC_IP: '{vm_LOCAL_IP}'
          DST_IP: '{vm_REMOTE_IP}'
      tools:
      - script: vm_network_latency_summary.py
        template: sudo python3 {path} --vm-interface {VM_INTERFACE} --phy-interface
          {PHY_INTERFACE} --direction {direction} --src-ip {SRC_IP} --dst-ip {DST_IP}
          --protocol {protocol} --interval 1
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: vm_network_latency_details.py
        template: sudo python3 {path} --vm-interface {VM_INTERFACE} --phy-interface
          {PHY_INTERFACE} --direction {direction} --src-ip {SRC_IP} --dst-ip {DST_IP}
          --protocol {protocol} --latency-us {latency_threshold}
        latency_threshold: 100
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: vm_network_performance_metrics.py
        template: sudo python3 {path} --vm-interface {VM_INTERFACE} --phy-interface
          {PHY_INTERFACE} --direction {direction} --src-ip {SRC_IP} --dst-ip {DST_IP}
          --protocol {protocol} --latency-us {latency_threshold}
        latency_threshold: 10
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
    linux-network-stack/packet-drop:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: eth_drop.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --l4-protocol
          {protocol}
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: kernel_drop_stack_stats_summary_all.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --l4-protocol
          {protocol} --interval 1
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: qdisc_drop_trace.py
        template: sudo python3 {path} --interval 1 --summary
    linux-network-stack:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: trace_conntrack.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --protocol
          {protocol}
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: trace_ip_defrag.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --protocol
          {protocol}
        parameters:
          protocol:
          - udp
    ovs:
      environment: vm
      directions:
        rx:
          SRC_IP: '{vm_REMOTE_IP}'
          DST_IP: '{vm_LOCAL_IP}'
        tx:
          SRC_IP: '{vm_LOCAL_IP}'
          DST_IP: '{vm_REMOTE_IP}'
      tools:
      - script: ovs_upcall_latency_summary.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --protocol
          {protocol} --interval 1
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: ovs_userspace_megaflow.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --protocol
          {protocol}
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
      - script: ovs-kernel-module-drop-monitor.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --protocol
          {protocol}
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
    kvm-virt-network/vhost-net:
      environment: vm
      tools:
      - script: vhost_eventfd_count.py
        template: sudo python3 {path} --interval 1
      - script: vhost_queue_correlation_simple.py
        template: sudo python3 {path} --device {VM_INTERFACE}
      - script: vhost_queue_correlation_details.py
        template: sudo python3 {path} --device {VM_INTERFACE} --verbose
      - script: vhost_buf_peek_stats.py
        template: sudo python3 {path} --interval 1
    kvm-virt-network/tun:
      environment: vm
      directions:
        rx:
          SRC_IP: '{vm_REMOTE_IP}'
          DST_IP: '{vm_LOCAL_IP}'
        tx:
          SRC_IP: '{vm_LOCAL_IP}'
          DST_IP: '{vm_REMOTE_IP}'
      tools:
      - script: tun_ring_monitor.py
        template: sudo python3 {path} --device {VM_INTERFACE} --protocol {protocol}
          --all
        parameters:
          protocol:
          - tcp
          - udp
      - script: tun_to_vhost_queue_status_simple_summary.py
        template: sudo python3 {path} --device {VM_INTERFACE}
      - script: tun_to_vhost_queue_stats_full_summary.py
        template: sudo python3 {path} --device {VM_INTERFACE}
      - script: tun_tx_to_kvm_irq.py
        template: sudo python3 {path} --device {VM_INTERFACE} --src-ip {SRC_IP} --dst-ip
          {DST_IP} --protocol {protocol} --stats-interval 10
        directions:
          rx:
            SRC_IP: '{vm_REMOTE_IP}'
            DST_IP: '{vm_LOCAL_IP}'
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
    kvm-virt-network/kvm:
      environment: vm
      directions:
        rx:
          SRC_IP: '{vm_REMOTE_IP}'
          DST_IP: '{vm_LOCAL_IP}'
        tx:
          SRC_IP: '{vm_LOCAL_IP}'
          DST_IP: '{vm_REMOTE_IP}'
      tools:
      - script: kvm_irqfd_stats_summary.py
        template: sudo python3 {path} {QEMU_PID} --interval 1 --vhost-pid {vhost_pid}
          --category data --subcategory {subcategory}
        parameters:
          vhost_pid:
          - '2044395'
          - '2044396'
          - '2044397'
          - '2044398'
          - '2044399'
          - '2044400'
          - '2044401'
          - '2044402'
          subcategory:
          - rx
          - tx
      - script: kvm_irqfd_stats_summary.py
        template: sudo python3 {path} {QEMU_PID} --interval 1 --category control
      - script: kvm_vhost_tun_latency_no_discovery_details.py
        template: sudo python3 {path} --device {VM_INTERFACE} --flow proto={protocol},src={SRC_IP},dst={DST_IP}
        directions:
          tx:
            SRC_IP: '{vm_LOCAL_IP}'
            DST_IP: '{vm_REMOTE_IP}'
        parameters:
          protocol:
          - tcp
          - udp
          - icmp
    boundary-detection/vm-network:
      environment: vm
      directions:
        rx:
          SRC_IP: '{vm_REMOTE_IP}'
          DST_IP: '{vm_LOCAL_IP}'
        tx:
          SRC_IP: '{vm_LOCAL_IP}'
          DST_IP: '{vm_REMOTE_IP}'
      tools:
      - script: icmp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --rx-iface
          {PHY_INTERFACE} --tx-iface {VM_INTERFACE}
        parameters:
          protocol:
          - icmp
      - script: tcp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --rx-iface
          {PHY_INTERFACE} --tx-iface {VM_INTERFACE}
        parameters:
          protocol:
          - tcp
      - script: udp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --rx-iface
          {PHY_INTERFACE} --tx-iface {VM_INTERFACE}
        parameters:
          protocol:
          - udp
    boundary-detection/system-network:
      environment: host
      directions:
        rx:
          SRC_IP: '{host_REMOTE_IP}'
          DST_IP: '{host_LOCAL_IP}'
        tx:
          SRC_IP: '{host_LOCAL_IP}'
          DST_IP: '{host_REMOTE_IP}'
      tools:
      - script: system_icmp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --phy-iface
          {PHY_INTERFACE} --direction {direction}
        parameters:
          protocol:
          - icmp
      - script: system_tcp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --phy-iface
          {PHY_INTERFACE}
        parameters:
          protocol:
          - tcp
      - script: system_udp_path_tracer.py
        template: sudo python3 {path} --src-ip {SRC_IP} --dst-ip {DST_IP} --phy-iface
          {PHY_INTERFACE}
        parameters:
          protocol:
          - udp
performance_tests:
  throughput:
    single_stream:
      duration: 10
    multi_stream:
      duration: 10
      streams: 4
  latency:
    duration: 10
    tcp_rr: {}
    udp_rr: {}
  pps:
    single_stream:
      duration: 10
      target_bw: 1G
    multi_stream:
      duration: 10
      streams: 4
      target_bw: 1G
  icmp_ping:
    duration: 10
    interval: '0.01'
    count: 0
    bidirectional: true
